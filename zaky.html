<!DOCTYPE html>
<html>
<head>
    <title>Biodata</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b3d91, #e31b23);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            color: #e31b23;
            font-size: 40px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #0b3d91;
            font-weight: bold;
        }

        .logo {
            font-size: 70px;
            color: #e31b23;
            margin: 10px;
        }

        .biodata {
            text-align: left;
            background-color: #f1f5ff;
            border-left: 7px solid #e31b23;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .biodata p {
            font-size: 17px;
            line-height: 1.6;
        }

        .label {
            color: #0b3d91;
            font-weight: bold;
        }

        .quote {
            margin-top: 25px;
            background-color: #e31b23;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-style: italic;
        }

        footer {
            margin-top: 20px;
            color: #0b3d91;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">★</div>

        <h1>biodata</h1>

        <div class="biodata">
            <p><span class="label">Nama:</span> Zaky Althaf Rayn</p>
            <p><span class="label">Asal:</span> indonesia</p>
            <p><span class="label">Tempat Tinggal:</span> perumahan padang sarai rw.11 rt02 blok H24</p>
            <p><span class="label">Pekerjaan:</span> Siswa</p>
            <p><span class="label">usia:</span> 15 tahun
            </p>
        </div>


    </div>

</body>
</html>
